    <style>
      html, body { overscroll-behavior-y: none; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      ::selection { background: rgba(245, 158, 11, 0.22); color: #060b00; }

      /* Keyboard focus ring for any control that does not define its own.
         :where() keeps specificity at zero so Tailwind focus/outline utilities still win. */
      :where(button, a, [role="button"], [tabindex="0"], summary, select):focus-visible {
        outline: 2px solid rgba(6, 11, 0, 0.35);
        outline-offset: 2px;
      }
      
      /* Print view is hidden on screen by default */
      .print-view { display: none; }
      
      /* Firefox only — Chromium keeps the ::-webkit-scrollbar styling below. */
      @supports not selector(::-webkit-scrollbar) {
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #e2e8f0 transparent; }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

      /* Sidebar and other chrome that must never show browser scrollbars. */
      .ilios-no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .ilios-no-scrollbar::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      .ilios-notification-corner { max-height: calc(100dvh - 32px); }
      @media (max-width: 1023px), (pointer: coarse) {
        body .ilios-notification-corner { bottom: calc(5rem + env(safe-area-inset-bottom, 0px) + 12px); max-height: calc(100dvh - 7rem); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ilios-notification-corner *, .ilios-notification-corner *::before { animation: none !important; transition: none !important; }
      }
      @media print {
        aside, header, nav, .no-print { 
          display: none !important; 
        }
        main {
          margin-left: 0 !important;
          padding: 0 !important;
        }
        #root {
          background: white !important;
        }
        .print-view { 
          display: block !important; 
        }
      }
    </style>
