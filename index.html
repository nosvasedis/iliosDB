
<!DOCTYPE html>

  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Ilios Kosmima ERP</title>
    <meta name="description" content="Jewelry Manufacturing Management System" />
    <meta name="theme-color" content="#060b00" />
    
    <link rel="manifest" href="/manifest.json?v=ilios-sun-v2" />
    <link rel="icon" type="image/x-icon" href="/icons/ilios-sun-v2/favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64 128x128 256x256" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/ilios-sun-v2/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/ilios-sun-v2/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/ilios-sun-v2/favicon-48x48.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/icons/ilios-sun-v2/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="167x167" href="/icons/ilios-sun-v2/apple-touch-icon-167x167.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/ilios-sun-v2/apple-touch-icon-180x180.png" />
    <link rel="mask-icon" href="/icons/ilios-sun-v2/safari-pinned-tab.svg" color="#b1842c" />
    <meta name="application-name" content="Ilios ERP" />
    <meta name="apple-mobile-web-app-title" content="Ilios ERP" />
    <meta name="msapplication-TileColor" content="#222d13" />
    <meta name="msapplication-TileImage" content="/icons/ilios-sun-v2/mstile-150x150.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
      html, body { overscroll-behavior-y: none; }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f3f4f6;
        margin: 0;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }

      ::selection { background: rgba(245, 158, 11, 0.22); color: #060b00; }

      /* Keyboard focus ring for any control that does not define its own.
         Tailwind 4 utilities live in cascade layers, which unlayered CSS always beats;
         keeping this in the base layer lets focus/outline utilities still win. */
      @layer base {
        :where(button, a, [role="button"], [tabindex="0"], summary, select):focus-visible {
          outline: 2px solid rgba(6, 11, 0, 0.35);
          outline-offset: 2px;
        }
      }
      
      /* Print view is hidden on screen by default */
      .print-view { display: none; }
      
      /* Firefox only — Chromium keeps the ::-webkit-scrollbar styling below. */
      @supports not selector(::-webkit-scrollbar) {
        .custom-scrollbar { scrollbar-width: thin; scrollbar-color: #e2e8f0 transparent; }
      }
      .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
      .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
      .custom-scrollbar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 10px; }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #cbd5e1; }

      /* Sidebar and other chrome that must never show browser scrollbars. */
      .ilios-no-scrollbar {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      .ilios-no-scrollbar::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }

      .ilios-notification-corner { max-height: calc(100dvh - 32px); }
      @media (max-width: 1023px), (pointer: coarse) {
        body .ilios-notification-corner { bottom: calc(5rem + env(safe-area-inset-bottom, 0px) + 12px); max-height: calc(100dvh - 7rem); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ilios-notification-corner *, .ilios-notification-corner *::before { animation: none !important; transition: none !important; }
      }
      @media print {
        aside, header, nav, .no-print { 
          display: none !important; 
        }
        main {
          margin-left: 0 !important;
          padding: 0 !important;
        }
        #root {
          background: white !important;
        }
        .print-view { 
          display: block !important; 
        }
      }
    </style>
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="index.tsx"></script>

  </body>
</html>
